name: CI

on:
  push:
    branches: ['main']
  pull_request:

# One run per ref; a new push cancels the stale build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same build the Docker image runs; catches type errors in the
      # RSC/SSR pipeline (vite build type-checks the standalone output).
      - name: Build
        run: pnpm exec vite build
