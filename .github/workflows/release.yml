# Publishes the app Docker image to GitHub Container Registry.
#
# Triggers:
#   - a semver tag (v1.2.3) publishes 1.2.3, 1.2 and latest
#   - a manual run publishes the short commit SHA, plus any tag you pass in
#
# Images:
#   ghcr.io/<owner>/web-porting-games   the vinext standalone Node server (deploy/Dockerfile)

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to publish (the short commit SHA is always published)
        required: false
        type: string

# Only one release per ref; a re-push of the same tag supersedes the running build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64

jobs:
  release-image:
    name: Release Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to ghcr.io with the workflow's GITHUB_TOKEN.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
